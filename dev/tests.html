<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Checks</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 24px; background: #fff; color: #111; }
  .pass { color: #1f7a36; } .fail { color: #b3202a; font-weight: bold; }
  #app, #ticket, #modal, #modal-body { display: none; }
</style>
</head>
<body>
<h1>Vote model checks</h1>
<p id="summary"></p>
<div id="out"></div>
<div id="app"></div><div id="ticket"></div><div id="modal" hidden><div id="modal-body"></div></div>
<!-- Content: the game's data and text -->
<script src="../js/content/data.js"></script>
<script src="../js/content/candidates.js"></script>
<script src="../js/content/questions.js"></script>
<script src="../js/content/debates.js"></script>
<script src="../js/content/events.js"></script>
<script src="../js/content/campaigns.js"></script>
<script src="../js/content/epilogue.js"></script>
<script src="../js/content/runoff.js"></script>
<script src="../js/content/media.js"></script>
<script src="../js/content/reactions.js"></script>
<!-- Engine: rules and state -->
<script src="../js/engine/config.js"></script>
<script src="../js/engine/state.js"></script>
<script src="../js/engine/model.js"></script>
<script src="../js/engine/campaign.js"></script>
<script src="../js/engine/decisions.js"></script>
<script src="../js/engine/trail.js"></script>
<script src="../js/engine/election.js"></script>
<script src="../js/engine/save.js"></script>
<!-- Interface: rendering and input (app.js starts the game) -->
<script src="../js/ui/components.js"></script>
<script src="../js/ui/screens.js"></script>
<script src="../js/ui/endings.js"></script>
<script src="../js/ui/modals.js"></script>
<script src="../js/ui/app.js"></script>
<script>
// Keep the game from writing to storage or the page while the checks run.
save = () => {}; render = () => {};
const results = [];
const ok = (name, cond, detail = '') => results.push({ name, pass: !!cond, detail });
const near = (a, b, t = 1e-6) => Math.abs(a - b) < t;

// --- Input data ---
ok('Region registration shares add to 100%', REGIONS.reduce((a, r) => a + r.voters, 0) === 100);
ok('Every faction mix adds to 100%', REGIONS.every(r => near(sumVals(r.mix), 1)));
ok('Faction registered shares add to 100%', near(sumVals(registered), 100));
ok('Faction expected vote shares add to 100%', near(sumVals(expectedVote()), 100));
const turnout = TOTAL_WEIGHT() / REGISTERED_R;
ok('Statewide primary turnout is realistic (30–50%)', turnout > .3 && turnout < .5, `${(turnout * 100).toFixed(1)}% = ${Math.round(TOTAL_WEIGHT()).toLocaleString()} votes`);
ok('No region turnout above 100%', REGIONS.every(r => regionTurnout(r) < 1), REGIONS.map(r => `${r.name} ${(regionTurnout(r) * 100).toFixed(0)}%`).join(', '));
const regTotal = STATE_PROFILE.registeredR + STATE_PROFILE.registeredD + STATE_PROFILE.unaffiliated;
ok('Registration rate is realistic (65–80% of adults)', regTotal / STATE_PROFILE.adults > .65 && regTotal / STATE_PROFILE.adults < .8, `${(regTotal / STATE_PROFILE.adults * 100).toFixed(0)}%`);

const standardGame = seed => { newState('castellano', seed); for (const id in S.delta) S.delta[id] = {}; S.flags = {}; S.endorsements = Object.fromEntries(Object.entries(ENDORSERS).map(([k, v]) => [k, v.holder])); applyScenario(S, SCENARIOS[0]); S.warPlanned = null; return S; };
// --- A campaign in progress, with regional bonuses, GOTV and endorsements ---
standardGame(11);
S.bonus.you.fort = 10; S.bonus.dunmore.osgood = 8; S.gotv.bible = .1; S.gotv.fort = .2; S.delta.rick.faith = 6; S.endorsements.rifle = 'you';
const sv = stateVotes(S), st = stateShares(S), C = active(S);
ok('Statewide shares add to 100%', near(sumVals(st), 100));
ok('Statewide votes = sum of region votes', C.every(c => near(sv[c], REGIONS.reduce((a, r) => a + regionVotes(S, r.id)[c], 0))));
ok('Every region share adds to 100%', REGIONS.every(r => near(sumVals(regionShares(S, r.id)), 100)));
const fVotes = Object.fromEntries(FKEYS.map(f => [f, REGIONS.reduce((a, r) => {
  if (!r.mix[f]) return a;
  const sm = softmax(S, f, r.id, C);
  return a + factionVotes(r, f) * C.reduce((b, c, i) => b + sm[i] * gotvMult(S, c, r.id), 0);
}, 0)]));
const viaF = Object.fromEntries(C.map(c => [c, FKEYS.reduce((a, f) => a + fVotes[f] * factionShares(S, f)[c] / 100, 0) / sumVals(sv) * 100]));
ok('By-Faction crosstab adds up to the statewide poll', C.every(c => near(viaF[c], st[c])), C.map(c => `${c} ${st[c].toFixed(2)} = ${viaF[c].toFixed(2)}`).join(', '));
const viaR = Object.fromEntries(C.map(c => [c, REGIONS.reduce((a, r) => a + regionShares(S, r.id)[c] / 100 * sumVals(regionVotes(S, r.id)), 0) / sumVals(sv) * 100]));
ok('By-Region crosstab adds up to the statewide poll', C.every(c => near(viaR[c], st[c])));
const noG = JSON.parse(JSON.stringify(S)); noG.gotv = {};
const extra = sumVals(sv) - sumVals(stateVotes(noG));
ok('GOTV adds real votes', extra > 0, `+${Math.round(extra).toLocaleString()} votes`);

// --- Election night ---
S.screen = 'campaign'; S.step = SCHEDULE.length - 1;
runElection();
const e = S.election;
ok('Election total = sum of region counts', Object.keys(e.totalVotes).every(c => e.totalVotes[c] === REGIONS.reduce((a, r) => a + e.votes[r.id][c], 0)));
ok('Election shares add to 100%', near(sumVals(e.total), 100));
ok('Election turnout matches the model (within 3%)', Math.abs(e.cast / TOTAL_WEIGHT() - 1) < .03, `${e.cast.toLocaleString()} cast, ${Math.round(TOTAL_WEIGHT()).toLocaleString()} expected`);
ok('A runoff is called only when nobody reaches 40%', !!e.needsRunoff === (sorted(e.total)[0][1] < RUNOFF_LINE));

// --- Runoff campaign ---
{
  standardGame(777); S.screen = 'campaign'; S.step = SCHEDULE.length - 1;
  S.election = countVotes(S, active(S));
  const two = ['you', sorted(S.election.total).map(x => x[0]).find(id => id !== 'you')];
  S.election.needsRunoff = two;
  startRunoff();
  const R = S.runoff;
  ok('Runoff: only the two finalists are in the race', active(S).length === 2 && active(S).includes('you') && active(S).includes(R.rival));
  ok('Runoff: the campaign courts each eliminated candidate', R.queue.filter(q => q.startsWith('court:')).length === Math.min(3, S.field.length - 2), R.queue.join(', '));
  const before = stateShares(S).you;
  R.endorse[R.eliminated[0]] = 'you';
  const withYou = stateShares(S).you;
  R.endorse[R.eliminated[0]] = R.rival;
  const withRival = stateShares(S).you;
  ok('Runoff: an endorsement moves votes to the endorsee', withYou > before && withRival < before, `neutral ${before.toFixed(1)}%, endorses you ${withYou.toFixed(1)}%, endorses rival ${withRival.toFixed(1)}%`);
  R.endorse = {};
  const model = sumVals(stateVotes(S, R.two));
  const rr = countVotes(S, R.two, RUNOFF_TURNOUT);
  ok('Runoff turnout is 80% of the two-candidate vote (within 3%)', Math.abs(rr.cast / model / RUNOFF_TURNOUT - 1) < .03, `${rr.cast.toLocaleString()} votes`);
  ok('Runoff shares add to 100%', near(sumVals(rr.total), 100));
}

// --- Seeds and scenarios ---
{
  const a = newState('castellano', 424242), b = { scenario: a.scenario, war: a.warPlanned };
  const c = newState('castellano', 424242);
  ok('The same seed gives the same scenario and war roll', c.scenario === b.scenario && c.warPlanned === b.war, `seed 424242 → ${b.scenario}, war ${b.war}`);
  const counts = {}; let wars = 0, randomWars = 0, randomGames = 0; const N = 4000;
  for (let i = 1; i <= N; i++) {
    const x = newState('castellano', i * 7919); counts[x.scenario] = (counts[x.scenario] || 0) + 1;
    if (x.warPlanned != null) wars++;
    if (scenarioOf(x).warAt == null) { randomGames++; if (x.warPlanned != null) randomWars++; }
  }
  const total = SCENARIOS.reduce((t, x) => t + x.weight, 0);
  ok('Scenario frequencies match their weights (within 2.5 points)', SCENARIOS.every(x => Math.abs((counts[x.id] || 0) / N * 100 - x.weight / total * 100) < 2.5),
    SCENARIOS.map(x => `${x.id} ${((counts[x.id] || 0) / N * 100).toFixed(1)}% (target ${(x.weight / total * 100).toFixed(0)}%)`).join(', '));
  ok('Random war frequency matches WAR.chance (within 1.5 points)', Math.abs(randomWars / randomGames - WAR.chance) < .015, `${(randomWars / randomGames * 100).toFixed(1)}% (target ${WAR.chance * 100}%)`);
  const certain = SCENARIOS.filter(x => x.warAt != null).reduce((t, x) => t + x.weight, 0) / total;
  const expectWar = WAR.chance + certain * (1 - WAR.chance);
  ok('Total war frequency matches random wars plus the Reckoning (within 1.5 points)', Math.abs(wars / N - expectWar) < .015, `${(wars / N * 100).toFixed(1)}% (expected ${(expectWar * 100).toFixed(1)}%)`);
  ok('Every scenario starts with all six playable candidates', SCENARIOS.every(x => x.field.length === 6 && PLAYABLE.every(p => x.field.includes(p))));
  newState('rick', 77); ok('The candidate you play takes the player slot and leaves the rival field', S.field.includes('you') && !S.field.includes('rick') && S.field.includes('castellano') && S.endorsements.pastors === 'you');
  const cel = SCENARIOS.find(x => x.id === 'celebrity'); newState('castellano', 1); for (const id in S.delta) S.delta[id] = {}; applyScenario(S, cel); S.step = cel.enter.coburn;
  lateEntries(S);
  ok('Late entry: the outsider joins at the right step', active(S).includes('coburn') && active(S).length === 7);
  const allRivals = [...new Set(SCENARIOS.flatMap(x => [...x.field, ...Object.keys(x.enter || {})]))].filter(id => id !== 'you');
  ok('Every possible rival has news, debate answers, an ending and a runoff meeting (the President never endorses Whitlock)', allRivals.every(id => NEWS[id] && RIVAL_OUTCOMES[id] && COURT[id] && (ENDORSE_TEXT[id] || id === 'whitlock') && DEBATE_QUESTIONS.every(q => q.rivals[id])), allRivals.join(', '));
  newState('castellano', 5); S.field = ['you', 'dunmore', 'rick', 'krantz', 'whitlock'];
  ok('Debate questions about an absent rival are never asked', DEBATE_QUESTIONS.filter(q => q.needs.every(id => active(S).includes(id))).every(q => !q.needs.includes('vaskel')));
}

// --- Scenario turnout ---
{
  standardGame(3); const base = expectedVote().online;
  const baseSeniors = expectedVote().seniors;
  for (const id in S.delta) S.delta[id] = {}; applyScenario(S, SCENARIOS.find(x => x.id === 'reckoning'));
  const surge = expectedVote().seniors;
  ok('Scenario turnout: the Reckoning brings older voters back', surge > baseSeniors + 1, `Older voters' share of the vote ${baseSeniors.toFixed(1)}% → ${surge.toFixed(1)}%`);
  ok('Scenario turnout: expected vote shares still add to 100%', near(sumVals(expectedVote()), 100));
  S = null;
}

// --- The war ---
{
  standardGame(99); S.step = 12; S.endorsed = 'dunmore';
  const pre = stateShares(S);
  S.war = { start: 8 };
  const post = stateShares(S);
  ok('War: the President\'s endorsed candidate loses support', post.dunmore < pre.dunmore, `Dunmore ${pre.dunmore.toFixed(1)}% → ${post.dunmore.toFixed(1)}%`);
  ok('War: the traditional conservative, far from the President, gains', post.whitlock > pre.whitlock, `Whitlock ${pre.whitlock.toFixed(1)}% → ${post.whitlock.toFixed(1)}%`);
  ok('War: the President\'s endorsement makes the damage worse', warLoyalty(S, 'dunmore') > warLoyalty(S, 'krantz') + .4);
  S.flags.war_dove = 1; const dove = warLoyalty(S, 'you'); delete S.flags.war_dove; S.flags.war_hawk = 1; const hawk = warLoyalty(S, 'you');
  ok('War: opposing the war protects you, supporting it exposes you', dove < WAR.pivot && hawk > dove);
  S.war = { start: 12 }; const ramp1 = warPenalty(S, 'dunmore', 'online'); S.war = { start: 8 }; const ramp4 = warPenalty(S, 'dunmore', 'online');
  ok('War: the oil shock grows over the first weeks', ramp4 > ramp1 && ramp1 > 0);
  ok('War: evangelicals move the other way', warPenalty(S, 'dunmore', 'faith') < 0);
}

// --- Debates, runoff meetings, media ---
{
  standardGame(41); S.record = 'income'; S.screen = 'campaign';
  const q = DEBATE_QUESTIONS.find(x => x.id === 'd_prove'), closing = DEBATE_QUESTIONS.find(x => x.id === 'd_closing');
  const n = nearestRival(S);
  S.delta.you = {}; addAll(S, n.id, 0);
  const near = nearestRival(S), opts = buildDebateOptions(S, q, 1);
  ok('Debate: an attack on the nearest rival is offered when the race is close', Math.abs(near.gap) <= CLOSE_RACE ? opts.some(o => o.attackOpt && o.fx.opp[near.id] < 0) : !opts.some(o => o.attackOpt), `${CAND[near.id].short} gap ${near.gap.toFixed(1)}`);
  addAll(S, 'you', 40);
  ok('Debate: no attack option when you are far ahead', !buildDebateOptions(S, q, 1).some(o => o.attackOpt));
  S.delta.you = {};
  const c1 = buildDebateOptions(S, closing, 1).map(o => o.text), c2 = buildDebateOptions(S, closing, 2).map(o => o.text);
  S.record = 'heartland'; const c3 = buildDebateOptions(S, closing, 1).map(o => o.text);
  ok('Closing statements differ between the two debates', c1.join() !== c2.join());
  ok('Closing statements change with your record', c1[0] !== c3[0]);
  ok('Every runoff meeting has a stay-away option', Object.values(COURT).every(C => C.choices.some(ch => ch.stayAway)));
  ok('Strong runoff offers cost you with other factions', Object.values(COURT).every(C => C.choices.some(ch => FKEYS.some(f => (ch.fx[f] || 0) <= -2))));
  const r = buildReactions(S, 'donor_wife:0', { chamber: 4, online: -6 }, 'test');
  ok('Media: every decision gets a chyron and two posts', r.chyron.text && r.boomer && r.groyper && OUTLETS[r.chyron.outlet]);
  const content = JSON.stringify([QUESTIONS, EVENTS, DEBATE_QUESTIONS, COURT, RUNOFF_EVENTS, SCENARIOS, WAR_NEWS, NEWS, EPILOGUE, RIVAL_OUTCOMES, BOOMER_POSTS, GROYPER_POSTS, REACTIONS, TEXT], (k, v) => typeof v === 'function' ? v.toString() : v);
  ok('No real network names or "Iran" in the game text', !/Iran|Fox News|Newsmax/.test(content));
  S = null;
}

// --- Events: kinds, weights, choice conditions, running-mate swaps ---
{
  let over = 0; const seen = { record: 0, mate: 0, own: {} };
  for (let g = 0; g < 240; g++) {
    const p = PLAYABLE[g % PLAYABLE.length];
    standardGame(60000 + g); S.player = p; applyPlayer(S); S.record = pick(OPENINGS[p]).id; S.mate = pick(MATES[p]).id;
    for (let st = 0; st < SCHEDULE.length; st++) if (SCHEDULE[st] === 'event') {
      S.step = st; const e = pickEvent(S); if (e) S.seenEvents.push(e.id);
    }
    const count = {}, evs = S.seenEvents.map(id => EVENTS.find(x => x.id === id));
    for (const e of evs) if (!e.priority) count[e.kind] = (count[e.kind] || 0) + 1;
    if (Object.entries(KIND_LIMITS).some(([k, n]) => (count[k] || 0) > n)) over++;
    if (p === 'castellano' && evs.some(e => e.kind === 'Record')) seen.record++;
    if (evs.some(e => e.kind === 'Running Mate')) seen.mate++;
    seen.own[p] = (seen.own[p] || 0) + evs.filter(e => e.weight === OWN && !/notGov|vsGov|isGov/.test(e.cond.toString())).length;
  }
  ok('Events: no game goes over the limit for a kind of event', over === 0, `${over} of 240 games`);
  ok('Events: most games have a running-mate event, and most Governor games a record event', seen.mate > 200 && seen.record > 30, `running mate ${seen.mate}/240, record ${seen.record}/40`);
  ok('Events: every candidate sees several events of their own campaign', PLAYABLE.every(p => seen.own[p] / 40 >= 2.5), PLAYABLE.map(p => `${p} ${(seen.own[p] / 40).toFixed(1)}`).join(', '));
  const noMateEvent = RUNNING_MATES.filter(m => !EVENTS.some(e => e.kind === 'Running Mate' && (standardGame(1), S.player = m.for, S.mate = m.id, e.cond(S))));
  ok('Events: every Governor\'s record and every running mate has its own event', OPENINGS.castellano.every(r => EVENTS.some(e => e.kind === 'Record' && (standardGame(1), S.record = r.id, e.cond(S))))
    && noMateEvent.length === 0, noMateEvent.map(m => m.id).join(', '));
  const asPlayer = p => { standardGame(1); S.player = p; applyPlayer(S); S.mate = MATES[p][0].id; S.record = OPENINGS[p][0].id; S.flags = {}; return S; };
  const thin = [];
  for (const p of PLAYABLE) { asPlayer(p); for (const e of [...EVENTS, ...RUNOFF_EVENTS]) if (shownChoices(S, e.choices).length < 2) thin.push(`${p}:${e.id}`); }
  ok('Events: every candidate sees at least two choices in every event', thin.length === 0, thin.slice(0, 10).join(', '));
  ok('Events: every choice that depends on an earlier decision shows why', [...EVENTS, ...RUNOFF_EVENTS].every(e => e.choices.every(ch => !ch.cond || ch.unlock || /isGov|notGov|vsGov|player|inRace|oppo_dunmore_used|c\(s\) && old\(s\)/.test(ch.cond.toString()))));
  let badP = [];
  for (const r of RECORDS) for (const m of RUNNING_MATES) for (const pres of [0, 50, 100]) {
    standardGame(2); S.record = r.id; S.mate = m.id; S.pres = pres; S.money = pres / 20;
    for (const e of EVENTS) for (const ch of e.choices) if (ch.risk) { const p = riskP(S, ch.risk); if (!(p >= .05 && p <= .95)) badP.push(e.id); }
  }
  ok('Events: every risk chance is between 5% and 95%', badP.length === 0, [...new Set(badP)].join(', '));
  standardGame(3); S.step = 12;
  applyFx(S, RUNNING_MATES.find(m => m.id === 'voss').fx); S.mate = 'voss';
  applyFx(S, { mate: 'ellender' });
  const want = { faith: 3 * TUNE.posMult, seniors: 1 * TUNE.posMult, online: -.5 };
  ok('Running-mate swap removes the old mate and adds half of the new one', S.mate === 'ellender' && S.formerMate === 'voss' && S.flags.mate_swap
    && FKEYS.every(f => near(S.delta.you[f] || 0, want[f] || 0)), JSON.stringify(S.delta.you));
  standardGame(4); S.step = 8; S.record = 'rifle'; S.mate = 'brannigan'; S.endorsements.rifle = 'you';
  const roadrage = EVENTS.find(e => e.id === 'rifle_roadrage');
  ok('Choice conditions: the Rifle Association choice appears only with its endorsement', shownChoices(S, roadrage.choices).includes(4) && (S.endorsements.rifle = 'krantz', !shownChoices(S, roadrage.choices).includes(4)));
  S = null;
}

// --- Story arcs and follow-ups: play every event step with a fixed choice ---
{
  const playEvents = (setup, choose = () => 0) => {
    standardGame(77); S.record = 'income'; S.mate = 'pryce'; setup(S); S.screen = 'campaign';
    for (let st = 0; st < SCHEDULE.length - 1; st++) {
      S.step = st;
      if (SCHEDULE[st] !== 'event') continue;
      const e = pickEvent(S); if (!e) continue;
      S.seenEvents.push(e.id);
      S.cur = { type: 'event', eid: e.id, sel: null, answered: null, breaking: [], shown: shownChoices(S, e.choices) };
      S.cur.sel = S.cur.shown[Math.min(choose(e), S.cur.shown.length - 1)];
      answer();
    }
    return S;
  };
  const w = playEvents(s => { s.flags.indicted = 1; s.scenario = 'wounded'; });
  ok('Wounded Incumbent: the three steps of the arc happen in order', ['indict_plea', 'indict_testimony', 'indict_verdict'].every((id, i, a) => w.seenEvents.indexOf(id) > (i ? w.seenEvents.indexOf(a[i - 1]) : -1)), w.seenEvents.join(', '));
  const p = playEvents(s => { s.flags.indicted = 1; }, e => e.id === 'indict_plea' ? 1 : e.id === 'indict_verdict' ? 3 : 0);
  ok('Wounded Incumbent: a pardon offer unlocks the pardon at the end', !!p.flags.tolliver_pardoned && consequences(p).some(t => t.includes('pardoned Mark Tolliver')));
  for (const [flag, id] of [['hale_out', 'hale_money'], ['no_prop_tax', 'superintendents'], ['oppo_war', 'oppo_revenge']]) {
    const g = playEvents(s => { s.flags[flag] = 1; });
    ok(`Follow-up: the "${flag}" decision comes back as "${id}"`, g.seenEvents.includes(id));
  }
  const allIds = [...EVENTS, ...RUNOFF_EVENTS].map(e => e.id);
  ok('Every event id is unique', new Set(allIds).size === allIds.length);
  ok('Every event kind has a color', EVENTS.every(e => EVENT_KINDS[e.kind]));
  S = null;
}

// --- The President's endorsement ---
{
  standardGame(21); S.step = SCHEDULE.indexOf('endorse');
  const sh = stateShares(S);
  const weak = sorted(sh).map(e => e[0]).filter(id => id !== 'you' && id !== 'whitlock').pop();
  S.presOverride[weak] = 100;
  const pick1 = presidentsChoice(S);
  ok('President: never endorses a rival who cannot win', sh[weak] >= PRES_ENDORSE.viable || pick1 !== weak, `${CAND[weak].short} ${sh[weak].toFixed(1)}% → ${pick1}`);
  S.pres = PRES_ENDORSE.youNeed - 1; addAll(S, 'you', 30);
  ok('President: does not endorse you below the required opinion', presidentsChoice(S) !== 'you');
  S.pres = 100; for (const id in S.presOverride) S.presOverride[id] = 0;
  ok('President: endorses you when he trusts you and you can win', presidentsChoice(S) === 'you');
  standardGame(22); S.step = 20; S.endorsed = sorted(stateShares(S)).map(e => e[0]).filter(id => id !== 'you' && id !== 'whitlock').pop();
  addAll(S, S.endorsed, -60);
  checkDropouts(S);
  ok('President: his candidate never drops out', !S.dropped.includes(S.endorsed), CAND[S.endorsed].short);
  standardGame(23); S.step = 20;
  const without = factionShares(S, 'maga').krantz; S.endorsed = 'krantz'; const before = factionShares(S, 'maga').krantz;
  ok('President: the MAGA base moves strongly to his candidate', before > without * 2, `Krantz ${without.toFixed(1)}% → ${before.toFixed(1)}% of MAGA voters`);
  const favorSteps = [];
  for (let seed = 1; seed <= 40; seed++) {
    standardGame(seed); S.seed = seed;
    for (let st = 0; st < SCHEDULE.length; st++) if (SCHEDULE[st] === 'event') { S.step = st; const e = pickEvent(S); if (e) { S.seenEvents.push(e.id); if (FAVORS.includes(e.id)) favorSteps.push(st); } }
  }
  ok('Every game has a favor for the President\'s circle before his endorsement', favorSteps.length === 40 && favorSteps.every(st => st < SCHEDULE.indexOf('endorse')), `${favorSteps.length}/40`);
  S = null;
}

// --- Media reactions and money ---
{
  const keys = [];
  for (const q of QUESTIONS) q.answers.forEach((a, i) => keys.push([`${q.id}:${i}`, a]));
  for (const e of [...EVENTS, ...RUNOFF_EVENTS]) e.choices.forEach((c, i) => keys.push([`${e.id}:${i}`, c]));
  for (const [id, C] of Object.entries(COURT)) C.choices.forEach((c, i) => keys.push([`court_${id}:${i}`, c]));
  for (const q of DEBATE_QUESTIONS) if (q.id !== 'd_closing') q.answers.forEach((a, i) => keys.push([`${q.id}:${i}`, a]));
  for (const [id, L] of Object.entries(ATTACK_LINES)) L.forEach((t, i) => keys.push([`attack:${id}:${i}`, { text: t }]));
  for (const r of RECORDS) keys.push([`close:record:${r.id}`, { text: RECORD_CLOSE[r.id] }]);
  for (const k of ['leading', 'behind', 'moderate', ...FKEYS]) keys.push([`close:${k}`, {}]);
  const missing = keys.filter(([k]) => !REACTIONS[k] || REACTIONS[k].length < 3).map(([k]) => k);
  ok('Media: every decision has its own posts and chyron', missing.length === 0, missing.length ? missing.slice(0, 8).join(', ') : `${keys.length} decisions`);
  const noFail = keys.filter(([k, c]) => c.risk && REACTIONS[k]?.length < 6).map(([k]) => k);
  ok('Media: every gamble has its own reactions for failure', noFail.length === 0, noFail.join(', '));
  // Text written as a function is checked for every candidate who can see it.
  const allText = t => typeof t !== 'function' ? t : PLAYABLE.map(p => { try { standardGame(1); S.player = p; applyPlayer(S); S.mate = MATES[p][0].id; return t(S); } catch (e) { return ''; } }).join(' ');
  const words = t => (allText(t) || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  const quoting = [];
  for (const [k, c] of keys) {
    const r = REACTIONS[k]; if (!r || !c.text) continue;
    const cw = words(c.text), grams = new Set();
    for (let i = 0; i + 5 <= cw.length; i++) grams.add(cw.slice(i, i + 5).join(' '));
    r.forEach((t, j) => { if (j % 3 === 2) return; const tw = words(t); for (let i = 0; i + 5 <= tw.length; i++) if (grams.has(tw.slice(i, i + 5).join(' '))) { quoting.push(k); break; } });
  }
  ok('Media: no post quotes the decision (5 or more words in a row)', quoting.length === 0, quoting.join(', '));
  const posts = Object.values(REACTIONS).flatMap(r => r.filter((_, j) => j % 3 !== 2)).filter(t => !t.startsWith('[This post'));
  ok('Media: no two posts are the same', new Set(posts).size === posts.length, `${posts.length} posts`);
  ok('Media: fallback posts never quote the decision', ![...Object.values(BOOMER_POSTS), ...Object.values(GROYPER_POSTS)].flat().some(t => t.includes('{quote}')));
  standardGame(31); S.screen = 'campaign';
  const r1 = buildReactions(S, 'deport:0', QUESTIONS[0].answers[0].fx, QUESTIONS[0].answers[0].text);
  ok('Media: a decision shows its own reactions', r1.boomer.startsWith('NATIONAL GUARD') && r1.chyron.outlet === 'max' && !r1.chyron.text.includes('{'));
  const rl = buildReactions(S, 'tornado:3', {}, '', 'lose');
  ok('Media: a failed gamble shows its failure reactions', rl.chyron.text.includes('UNGRATEFUL'));
  // Money
  const lists = [...QUESTIONS.map(q => q.answers), ...EVENTS.map(e => e.choices.filter(c => !c.cond)), ...RUNOFF_EVENTS.map(e => e.choices), ...Object.values(COURT).map(C => C.choices)];
  ok('Money: every decision has at least one choice that costs nothing', lists.every(l => l.some(c => !costOf(c))));
  S.money = .5;
  const ev = EVENTS.find(e => e.id === 'vaskel_ads');
  S.cur = { type: 'event', eid: ev.id, sel: 0, answered: null, breaking: [], shown: shownChoices(S, ev.choices) };
  const before = { money: S.money, lib: S.delta.you.liberty || 0 };
  answer();
  ok('Money: a choice you cannot pay for is refused', S.cur.answered == null && S.money === before.money && (S.delta.you.liberty || 0) === before.lib);
  S.cur.sel = 1; answer();
  ok('Money: a choice you can pay for still works', S.cur.answered === 1 && near(S.money, 0));
  S = null;
}

// --- Playing any candidate ---
{
  const named = [];
  for (const p of PLAYABLE) {
    newState(p, 5); const short = CAND[p].short;
    for (const q of DEBATE_QUESTIONS) if (q.id !== 'd_closing' && q.needs.every(id => active(S).includes(id)) && (!q.cond || q.cond(S)) && q.text.includes(short)) named.push(`${p}:${q.id}`);
  }
  ok('Debates: no candidate is asked a question about themselves', named.length === 0, named.join(', '));
  const bad = [];
  for (const p of PLAYABLE) { newState(p, 6); if (!OPENINGS[p]?.length || MATES[p]?.length !== 4 || !STAFF_TEAMS[p] || !PLAYER_INFO[p] || !RIVAL_OUTCOMES[p] || !RIVAL_SPEECH[p] || !ENDORSE_TEXT[p]) bad.push(p);
    if (!OPENINGS[p].every(r => RECORD_CLOSE[r.id] && SPEECH.record[r.id])) bad.push(p + ' openings'); if (!MATES[p].every(m => YOUR_SPEECH.mate[m.id])) bad.push(p + ' mates'); }
  ok('Every playable candidate has openings, four running mates, staff, speeches and endings', bad.length === 0, bad.join(', '));
  newState('dunmore', 7);
  ok('Shared text names the candidate you play as "your rival"', rivalize(S, 'Dunmore will call it amnesty.') === 'Your rival will call it amnesty.' && rivalize(S, 'Krantz agrees.') === 'Krantz agrees.');
  const w = { easy: 0, hard: 0 };
  for (const d of ['easy', 'hard']) for (let i = 1; i <= 400; i++) { const x = newState('whitlock', i * 131, d); if (x.warPlanned != null) w[d]++; }
  ok('Whitlock: the war and her conditions are much more likely on Easy than on Hard', w.easy > w.hard * 3, `war in ${w.easy}/400 easy games, ${w.hard}/400 hard games`);
  S = null;
}

// --- Victory speeches ---
{
  const rivals = [...new Set(SCENARIOS.flatMap(x => [...x.field, ...Object.keys(x.enter || {})]))].filter(id => id !== 'you');
  ok('Speeches: every rival has a victory speech with its own voice', rivals.every(id => RIVAL_SPEECH[id] && RIVAL_SPEECH[id].open.default && RIVAL_SPEECH[id].close));
  ok('Speeches: you have a line for every rival you can beat', rivals.every(id => YOUR_SPEECH.rival[id]));
  const game = (setup) => {
    standardGame(51); S.record = 'income'; S.mate = 'voss';
    S.election = countVotes(S, active(S)); S.finalWinner = 'you'; setup(S); return S;
  };
  const plain = yourSpeech(game(() => {})).join(' ');
  const runoff = yourSpeech(game(s => { s.runoffResult = { total: { you: 52, dunmore: 48 } }; })).join(' ');
  const war = yourSpeech(game(s => { s.war = { start: 10 }; s.flags.war_dove = 11; })).join(' ');
  ok('Speeches: your speech changes with how you won', plain !== runoff && runoff.includes('runoff') && war.includes('war'));
  ok('Speeches: your speech thanks your running mate', plain.includes('Declan Voss'));
  const dun = w => { standardGame(52); S.election = countVotes(S, active(S)); S.finalWinner = w; return rivalSpeech(S, w).join(' '); };
  const clean = dun('dunmore');
  S.flags.tape2 = 3; const dirty = rivalSpeech(S, 'dunmore').join(' ');
  ok('Speeches: a rival\'s speech answers your campaign', clean !== dirty && dirty.includes('tapes') && !dirty.includes('{gov}'));
  ok('Speeches: every rival speech fills in your name', rivals.every(id => { standardGame(53); S.election = countVotes(S, active(S)); S.finalWinner = id; return rivalSpeech(S, id).every(p => !p.includes('{')); }));
  S = null;
}

// --- Difficulty ---
{
  const e = newState('castellano', 5150, 'easy'), eSc = e.scenario, eWar = e.warPlanned, eMoney = e.money, ePos = TUNE.posMult;
  const h = newState('castellano', 5150, 'hard');
  ok('Difficulty: the same seed gives the same scenario and war at every level', h.scenario === eSc && h.warPlanned === eWar);
  ok('Difficulty: Easy starts with more money than Hard', eMoney > h.money, `$${eMoney}M against $${h.money}M`);
  ok('Difficulty: Hard keeps less of your gains than Easy', TUNE.posMult < ePos);
  const risk = { p: .5 };
  ok('Difficulty: gambles work more often on Easy and less often on Hard', riskP({ difficulty: 'easy' }, risk) > riskP({ difficulty: 'normal' }, risk) && riskP({ difficulty: 'normal' }, risk) > riskP(h, risk));
  newState('castellano', 5150);
  ok('Difficulty: a new Normal game resets every tuning value', Object.keys(TUNE_NORMAL).every(k => TUNE[k] === TUNE_NORMAL[k]) && S.difficulty === 'normal');
  ok('Difficulty: an old save with no difficulty plays as Normal', difficultyOf({}) === DIFFICULTY.normal);
  S = null;
}

// --- General election bar ---
{ const margin = 20, r = 50 + margin / 2 - .7, d = 100 - r - 1.4; ok('General election: margin shown = margin used', near(r - d, margin)); }

// --- Calendar ---
ok('Last step is primary day', dateOf(SCHEDULE.length - 1) === 'August 4, 2030', dateOf(SCHEDULE.length - 1));
ok('Days to primary at the start', daysToPrimary(0) === 182, `${daysToPrimary(0)} days`);
ok('Days to primary always decrease and end at 0', SCHEDULE.every((_, i) => i === 0 || daysToPrimary(i) < daysToPrimary(i - 1)) && daysToPrimary(SCHEDULE.length - 1) === 0);

// --- Text claims ---
const byTurnout = REGIONS.slice().sort((a, b) => regionTurnout(b) - regionTurnout(a));
ok('Claim: Caney Ridge has the highest turnout except Lake Cheney', byTurnout[0].id === 'cheney' && byTurnout[1].id === 'bible', byTurnout.slice(0, 2).map(r => `${r.name} ${(regionTurnout(r) * 100).toFixed(1)}%`).join(', '));
ok('Claim: farmers are about 9% of registered Republicans', Math.round(registered.farm) === 9, `${registered.farm.toFixed(1)}%`);
ok('Claim: farmers vote above the statewide rate', FACTIONS.farm.turnout > turnout);
standardGame(12);
const w = stateShares(S).whitlock;
ok('Claim: Whitlock starts at about 5 or 6%', w >= 4.5 && w <= 7, `${w.toFixed(1)}%`);

// --- Content links ---
const bad = Object.keys(PROMISES).filter(k => {
  const [id, i] = k.split(':');
  const q = QUESTIONS.find(q => q.id === id) || EVENTS.find(e => e.id === id);
  return !q || !(q.answers || q.choices)[+i];
});
ok('Every promise points at a real answer', bad.length === 0, bad.join(', '));

// --- Output ---
const failed = results.filter(r => !r.pass).length;
document.getElementById('summary').innerHTML = failed ? `<span class="fail">${failed} of ${results.length} checks failed.</span>` : `<span class="pass">All ${results.length} checks passed.</span>`;
document.getElementById('out').innerHTML = results.map(r => `<div class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'} ${r.name}${r.detail ? ` <span style="color:#666">— ${r.detail}</span>` : ''}</div>`).join('');
</script>
